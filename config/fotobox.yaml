camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 30
  jpeg_quality: 80
  retry_interval: 2.0
session:
  root: data/sessions
  countdown_seconds: 5
  photo_count: 3
  interval_seconds: 5.0
collage:
  width: 1800
  height: 1200
  margin: 60
  gap: 24
  jpeg_quality: 95
  logo: assets/logo.png
background:
  enabled: true
  mode: greenscreen
  images:
  - assets/backgrounds/background_01.jpg
  - assets/backgrounds/background_02.jpg
  - assets/backgrounds/background_03.jpg
  greenscreen:
    hue_min: 40
    hue_max: 85
    saturation_min: 70
    value_min: 20
    feather: 3
  selection_mode: random
printer:
  enabled: true
  name: fotobox
admin:
  shutdown_pin: '1234'
