<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fotobox</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css?v=5"
    >
</head>

<body>

<main id="app">

    <header>
        <h1>Fotobox</h1>
        <div id="connection-status">
            Verbindung wird hergestellt …
        </div>
    </header>

    <section id="start-screen">

   <div class="camera-container">
       <img
           id="camera-stream"
           src="/api/camera/stream"
           alt="Kamera-Livebild"
       >
   </div>
        <button
            id="start-button"
            type="button"
            disabled
        >
            Start
        </button>

    </section>

    <section
        id="countdown-screen"
        class="hidden"
    >
        <div id="countdown">
            5
        </div>
    </section>

<section
    id="capture-screen"
    class="hidden"
>
    <div class="session-message">
        <h2>Aufnahme läuft</h2>

        <p id="capture-status">
            Foto 1 von 3
        </p>
    </div>
</section>

<section
    id="processing-screen"
    class="hidden"
>
    <div class="session-message">
        <h2>Fotos aufgenommen</h2>

        <p>
            Die Bilder werden verarbeitet …
        </p>
    </div>
</section>

<section
    id="error-screen"
    class="hidden"
>
    <div class="session-message">
        <h2>Es ist ein Fehler aufgetreten</h2>

        <p id="error-message"></p>

        <button
            id="restart-button"
            type="button"
        >
            Neu starten
        </button>
    </div>
</section>

</main>

<script src="/static/js/app.js?v=5"></script>

</body>
</html>
