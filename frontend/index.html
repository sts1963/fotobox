<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Fotobox"
    >

    <title>Fotobox</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css?v=9"
    >
</head>

<body>

<main id="app">

    <header>
        <h1>Fotobox</h1>

        <div id="connection-status">
            Verbindung wird hergestellt …
        </div>
    </header>


    <section id="start-screen">

        <div
            id="live-view"
            class="camera-container"
        >
            <img
                id="camera-stream"
                src="/api/camera/stream"
                alt="Livebild der Fotobox-Kamera"
            >
        </div>

        <button
            id="start-button"
            type="button"
            disabled
        >
            Start
        </button>

    </section>


    <section
        id="countdown-screen"
        class="hidden"
    >
        <div id="countdown">
            5
        </div>
    </section>


<section
    id="capture-screen"
    class="hidden"
>
    <div class="session-message">

        <h2 id="capture-title">
            Aufnahme läuft
        </h2>

        <div
            id="capture-photo-container"
            class="capture-photo-container hidden"
        >
            <img
                id="capture-photo-preview"
                alt="Gerade aufgenommenes Foto"
            >
        </div>

        <p id="capture-status">
            Foto 1 von 3
        </p>

        <div
            id="next-photo-countdown"
            class="next-photo-countdown hidden"
        ></div>

    </div>
</section>


    <section
        id="processing-screen"
        class="hidden"
    >
        <div class="session-message">

            <h2>Fotos aufgenommen</h2>

            <p>
                Die Collage wird erstellt …
            </p>

        </div>
    </section>


    <section
        id="preview-screen"
        class="hidden"
    >
        <div class="preview-container">

            <img
                id="collage-preview"
                alt="Fertige Fotobox-Collage"
            >

        </div>

        <div class="preview-actions">

            <button
                id="print-button"
                type="button"
                disabled
            >
                Drucken
            </button>

            <button
                id="preview-restart-button"
                type="button"
            >
                Neu starten
            </button>

        </div>

    </section>


    <section
        id="error-screen"
        class="hidden"
    >
        <div class="session-message">

            <h2>
                Es ist ein Fehler aufgetreten
            </h2>

            <p id="error-message"></p>

            <button
                id="restart-button"
                type="button"
            >
                Neu starten
            </button>

        </div>
    </section>

</main>

<script src="/static/js/app.js?v=9"></script>

</body>
</html>
